<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <title>Talaiots - Grid Mínim</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      /* Estil mínim per poder veure els límit de les columnes */
      [class*="col"] {
        border: 1px solid #000;
      }
    </style>
  </head>
  <body>
    <!-- 1. CONTENIDOR PRINCIPAL -->
    <div class="container">
      <h1>Talaiots de les Illes Balears</h1>

      <!-- 2. FILA AMB 3 COLUMNES IGUALS (4 + 4 + 4 = 12) -->
      <div class="row">
        <div class="col-12 col-md-4">
          <h3>Trepucó</h3>
          <p>Menorca</p>
        </div>
        <div class="col-12 col-md-4">
          <h3>Son Fornés</h3>
          <p>Mallorca</p>
        </div>
        <div class="col-12 col-md-4">
          <h3>Capocorb Vell</h3>
          <p>Mallorca</p>
        </div>
      </div>

      <!-- 3. FILA AMB 2 COLUMNES DESIGUALS (8 + 4 = 12) -->
      <div class="row">
        <div class="col-12 col-md-8">
          <h3>Què és un talaiot?</h3>
          <p>
            Són torres de pedra seca prehistòriques úniques de Mallorca i
            Menorca.
          </p>
        </div>
        <div class="col-12 col-md-4">
          <h3>Cronologia</h3>
          <p>Edat del Bronze i del Ferro.</p>
        </div>
      </div>
    </div>
  </body>
</html>
